name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the toolchain tests
        run: python3 -m unittest discover -s tests

      - name: Validate stories against the level contract
        run: python3 tools/validate.py -v

      - name: Check generated files are up to date
        run: python3 tools/build.py --check
